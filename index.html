<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d3461">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="水中輪投げ（ウォーターゲーム）を 3D で遊べるブラウザゲーム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tanuu5.github.io/water-game/">
  <meta property="og:title" content="ウォーターゲーム">
  <meta property="og:description" content="水中輪投げ（ウォーターゲーム）を 3D で遊べるブラウザゲーム">
  <meta property="og:image" content="https://tanuu5.github.io/water-game/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>ウォーターゲーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%228%22 y=%224%22 width=%2248%22 height=%2256%22 rx=%228%22 fill=%22%23ef3340%22/%3E%3Crect x=%2214%22 y=%2210%22 width=%2236%22 height=%2234%22 rx=%223%22 fill=%22%233fb8ff%22/%3E%3Ccircle cx=%2232%22 cy=%2227%22 r=%229%22 fill=%22none%22 stroke=%22%23ffe14d%22 stroke-width=%224%22/%3E%3Ccircle cx=%2220%22 cy=%2252%22 r=%224%22 fill=%22%23ffe14d%22/%3E%3Ccircle cx=%2244%22 cy=%2252%22 r=%224%22 fill=%22%23ffe14d%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.0/rapier.mjs"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="score-box">
        <svg class="score-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>
        <span id="score">0</span><span class="slash">/</span><span id="total">0</span>
      </div>
      <div id="timer-box" class="timer-box hidden">
        <span id="timer">0:00.0</span>
        <span id="best" class="best"></span>
      </div>
    </div>
    <div class="hud-right">
      <button id="btn-shake" class="icon-btn" aria-label="ふる" title="ふる（Space）">
        <svg viewBox="0 0 24 24"><path d="M4 12c2-3 4-3 6 0s4 3 6 0 3-3 4-2M4 17c2-3 4-3 6 0s4 3 6 0 3-3 4-2M4 7c2-3 4-3 6 0s4 3 6 0 3-3 4-2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-reset" class="icon-btn" aria-label="リセット" title="リセット（R）">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-sound" class="icon-btn" aria-label="サウンド" title="サウンド（M）">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn accent" aria-label="カスタマイズ" title="カスタマイズ">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7.6 7.6 0 0 1-2.1 1.2L14.7 21h-4l-.4-2.1a7.6 7.6 0 0 1-2.1-1.2l-1.9.7-2-3.4 1.6-1.2a7.7 7.7 0 0 1 0-2.9L4.3 9.7l2-3.4 1.9.7a7.6 7.6 0 0 1 2.1-1.2L10.7 3h4l.4 2.1a7.6 7.6 0 0 1 2.1 1.2l1.9-.7 2 3.4-1.6 1.2a7.7 7.7 0 0 1 0 2.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="hint-l" class="press-hint hidden"><span>おす!</span></div>
  <div id="hint-r" class="press-hint hidden"><span>おす!</span></div>

  <div id="toast" class="toast"></div>

  <div id="start" class="overlay">
    <div class="card title-card">
      <div class="logo">
        <span class="logo-sub">3D</span>
        <h1>ウォーター<br>ゲーム</h1>
      </div>
      <p class="lead">ボタンで水を噴き出して、<br>リングをペグに入れよう!</p>
      <ul class="howto">
        <li><b>画面の左半分／右半分</b>をタップ（長押し・連打もOK）</li>
        <li class="pc-only"><kbd>A</kbd><kbd>D</kbd> または <kbd>←</kbd><kbd>→</kbd> でボタン、<kbd>Q</kbd><kbd>E</kbd> でかたむける、<kbd>Space</kbd> でふる</li>
        <li>歯車ボタンで、中のアイテムや水の色を変えられます</li>
      </ul>
      <button id="btn-play" class="big-btn" disabled>読み込み中…</button>
      <div id="load-error" class="load-error hidden"></div>
    </div>
  </div>

  <div id="clear" class="overlay hidden">
    <div class="card clear-card">
      <div class="clear-title">コンプリート!</div>
      <div id="clear-time" class="clear-time"></div>
      <div id="clear-best" class="clear-best"></div>
      <div class="row">
        <button id="btn-again" class="big-btn">もういちど</button>
        <button id="btn-continue" class="big-btn ghost">ながめる</button>
      </div>
    </div>
  </div>

  <div id="panel" class="sheet hidden" role="dialog" aria-label="カスタマイズ">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2>カスタマイズ</h2>
        <button id="btn-close" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="panel-body" class="sheet-body"></div>
      <div class="sheet-foot">
        <button id="btn-defaults" class="big-btn ghost small">はじめの設定</button>
        <button id="btn-apply" class="big-btn small">これであそぶ</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
